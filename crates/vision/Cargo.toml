[package]
name = "filmcraft-vision"
description = "Local, verified CLIP image/text embeddings for media-library retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
clip = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
filmcraft-color = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
image = { version = "0.25", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { version = "=0.9.2", default-features = false, optional = true }
candle-nn = { version = "=0.9.2", default-features = false, optional = true }
candle-transformers = { version = "=0.9.2", default-features = false, optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"], optional = true }

[dev-dependencies]
tempfile = "3.27"
